<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #8b949e;
    --border: #e1e4e8;
    --accent: #2f81f7;
    --danger: #d1242f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #7d8590;
      --border: #30363d;
      --accent: #4493f8;
      --danger: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #itemInput {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    outline: none;
  }
  #itemInput:focus { border-color: var(--accent); }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .add-btn {
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
  }
  .add-btn:active { transform: scale(0.97); }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  li.checked .label {
    text-decoration: line-through;
    color: var(--muted);
  }
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .label {
    flex: 1;
    word-break: break-all;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 1.1rem;
    padding: 4px 8px;
    border-radius: 6px;
    line-height: 1;
  }
  .delete-btn:hover { background: rgba(248, 81, 73, 0.12); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 0.9rem;
  }
  .error {
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .footer {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .clear-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  .clear-btn:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <div class="subtitle">항목을 추가하고, 체크하고, 삭제하세요. Supabase에 자동으로 저장됩니다.</div>

  <div class="error" id="error" hidden></div>

  <form class="input-row" id="addForm">
    <input type="text" id="itemInput" placeholder="살 것을 입력하세요…" autocomplete="off" required>
    <button type="submit" class="add-btn" id="addBtn">추가</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty">불러오는 중…</div>

  <div class="footer">
    <span id="count"></span>
    <button class="clear-btn" id="clearChecked">체크된 항목 비우기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://pouwttbjhuaajoeuhanp.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_UMihx96yeYjZSx-9tjX3Fg_gnbRGc-i";
  const TABLE = "shopping_items";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const errorEl = document.getElementById("error");
  const form = document.getElementById("addForm");
  const input = document.getElementById("itemInput");
  const addBtn = document.getElementById("addBtn");
  const clearBtn = document.getElementById("clearChecked");

  let items = [];

  function showError(message, err) {
    if (err) console.error(err);
    errorEl.textContent = message;
    errorEl.hidden = false;
  }

  function clearError() {
    errorEl.hidden = true;
  }

  async function load() {
    const { data, error } = await db
      .from(TABLE)
      .select("id, text, checked, created_at")
      .order("created_at", { ascending: true });

    if (error) {
      emptyEl.textContent = "목록을 불러오지 못했습니다.";
      showError("목록을 불러오지 못했습니다: " + error.message, error);
      return;
    }

    clearError();
    items = data;
    emptyEl.textContent = "아직 항목이 없습니다.";
    render();
  }

  async function addItem(text) {
    const { data, error } = await db
      .from(TABLE)
      .insert({ text, checked: false })
      .select("id, text, checked, created_at")
      .single();

    if (error) {
      showError("항목을 추가하지 못했습니다: " + error.message, error);
      return;
    }

    clearError();
    items.push(data);
    render();
  }

  async function toggleItem(item, checked) {
    const previous = item.checked;
    item.checked = checked;
    render();

    const { error } = await db
      .from(TABLE)
      .update({ checked })
      .eq("id", item.id);

    if (error) {
      item.checked = previous;
      render();
      showError("변경 사항을 저장하지 못했습니다: " + error.message, error);
      return;
    }

    clearError();
  }

  async function deleteItem(item) {
    const { error } = await db.from(TABLE).delete().eq("id", item.id);

    if (error) {
      showError("항목을 삭제하지 못했습니다: " + error.message, error);
      return;
    }

    clearError();
    items = items.filter((i) => i.id !== item.id);
    render();
  }

  async function clearChecked() {
    const ids = items.filter((i) => i.checked).map((i) => i.id);
    if (!ids.length) return;

    clearBtn.disabled = true;
    const { error } = await db.from(TABLE).delete().in("id", ids);
    clearBtn.disabled = false;

    if (error) {
      showError("체크된 항목을 삭제하지 못했습니다: " + error.message, error);
      return;
    }

    clearError();
    items = items.filter((i) => !i.checked);
    render();
  }

  function render() {
    listEl.innerHTML = "";
    emptyEl.hidden = items.length > 0;

    items.forEach((item) => {
      const li = document.createElement("li");
      if (item.checked) li.classList.add("checked");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = item.checked;
      checkbox.addEventListener("change", () => {
        toggleItem(item, checkbox.checked);
      });

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.text;

      const del = document.createElement("button");
      del.className = "delete-btn";
      del.textContent = "✕";
      del.title = "삭제";
      del.addEventListener("click", () => {
        deleteItem(item);
      });

      li.append(checkbox, label, del);
      listEl.appendChild(li);
    });

    const checked = items.filter((i) => i.checked).length;
    countEl.textContent = items.length
      ? `${items.length}개 중 ${checked}개 완료`
      : "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addBtn.disabled = true;
    await addItem(text);
    addBtn.disabled = false;
    input.focus();
  });

  clearBtn.addEventListener("click", clearChecked);

  load();
</script>
</body>
</html>
